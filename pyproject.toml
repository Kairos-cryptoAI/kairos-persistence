[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-persistence"
version = "0.1.0"
description = "Transactional PostgreSQL/TimescaleDB audit trail and idempotency primitives for Kairos."
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "asyncpg>=0.29,<1",
    "kairos-core>=0.3,<0.4",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<27",
]

[project.scripts]
kairos-persistence-exporter = "kairos_persistence.metrics_exporter:main"

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "c358e03b1218d5ec953dae3d10a96b32dd35aa4d" }

[tool.hatch.build.targets.wheel]
packages = ["kairos_persistence"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires a real TimescaleDB instance",
]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
