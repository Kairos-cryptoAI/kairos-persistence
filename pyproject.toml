[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairos-persistence"
version = "0.1.0"
description = "Transactional PostgreSQL/TimescaleDB audit trail and idempotency primitives for Kairos."
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "asyncpg>=0.29",
    "kairos-core>=0.2.0",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["kairos_persistence"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
