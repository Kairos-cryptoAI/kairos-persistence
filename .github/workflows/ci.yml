name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-and-postgres:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos_test
          POSTGRES_DB: kairos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kairos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KAIROS_PERSISTENCE_DATABASE_URL: postgresql://kairos:kairos_test@localhost:5432/kairos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git"
      - run: ruff check .
      - run: mypy kairos_persistence
      - run: bandit -q -r kairos_persistence -x tests
      - run: pytest -q
      - name: Migration smoke
        run: python -c "import asyncio; from kairos_persistence import Database; d=Database(); asyncio.run(d.connect()); asyncio.run(d.migrate()); asyncio.run(d.close())"
