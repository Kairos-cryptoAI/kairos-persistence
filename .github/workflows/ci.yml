name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-quality:
    name: Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python "${{ matrix.python-version }}" --locked --dev
      - run: uv run --python "${{ matrix.python-version }}" --locked --dev ruff check .
      - run: uv run --python "${{ matrix.python-version }}" --locked --dev ruff format --check .
      - run: uv run --python "${{ matrix.python-version }}" --locked --dev mypy kairos_persistence
      - run: uv run --python "${{ matrix.python-version }}" --locked --dev bandit -q -r kairos_persistence -x tests
      - run: uv run --python "${{ matrix.python-version }}" --locked --dev pytest -q -m "not integration"
      - run: uv build --no-sources

  windows-unit:
    name: Windows unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --python 3.11 --locked --dev
      - run: uv run --python 3.11 --locked --dev pytest -q -m "not integration"

  timescale-integration:
    name: TimescaleDB integration
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos_test
          POSTGRES_DB: kairos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KAIROS_PERSISTENCE_DATABASE_URL: postgresql://kairos:kairos_test@localhost:5432/kairos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --python 3.11 --locked --dev
      - name: Migration smoke
        run: uv run --python 3.11 --locked --dev python scripts/migration_smoke.py
      - run: uv run --python 3.11 --locked --dev pytest -q -m integration
